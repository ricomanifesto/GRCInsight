server:
  port: 8080
  mode: debug
  host: 0.0.0.0
  allowed_origins: []  # Add explicit browser origins when needed

database:
  region: us-east-1
  endpoint: ""

python_service:
  url: http://localhost:8081
  timeout: 300s
  # Optional: when set, Go will directly invoke Python Lambda instead of HTTP
  lambda_function_name: ""
  # Enable async invocation to avoid API Gateway timeouts in production
  invoke_async: false

logging:
  level: info
  format: text

auth:
  api_key: ""  # Set API_KEY for both HTTP services; empty disables sensitive routes
