receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Metrics exposed for Prometheus to scrape on :8889.
  # Suffix generation is disabled so metric names match the Claude Code docs
  # verbatim (claude_code_token_usage, claude_code_cost_usage, ...).
  prometheus:
    endpoint: 0.0.0.0:8889
    add_metric_suffixes: false
  # Events/logs forwarded to Loki's native OTLP ingest endpoint.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
