version: '3.8'

services:
  go-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - GO_ENV=development
      - PYTHON_SERVICE_URL=http://python-service:8081
      - LLM_MODEL=${LLM_MODEL:-openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}
      - DATABASE_DSN=./data/grcinsight.db
      - LOG_LEVEL=info
      - API_KEY=${API_KEY:?API_KEY is required}
      - GRC_INTERNAL_TOKEN=${GRC_INTERNAL_TOKEN:-}
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./web:/app/web
    depends_on:
      - python-service
    networks:
      - grcinsight-network
    restart: unless-stopped

  python-service:
    build:
      context: ./agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - PYTHONPATH=/app
      - LLM_MODEL=${LLM_MODEL:-openrouter/nvidia/nemotron-3-ultra-550b-a55b:free}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?OPENROUTER_API_KEY is required}
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8081
      - API_KEY=${API_KEY:?API_KEY is required}
      - GRC_INTERNAL_TOKEN=${GRC_INTERNAL_TOKEN:-}
    networks:
      - grcinsight-network
    restart: unless-stopped

networks:
  grcinsight-network:
    driver: bridge

volumes:
  grcinsight-data:
