name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  reporting-identity:
    name: Reporting Identity Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fetch canonical reporting identity contract
        run: |
          if ! curl --fail --silent --show-error --location \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            https://raw.githubusercontent.com/ricomanifesto/SentryDigest/main/contracts/reporting-identity-v1.json \
            --output "$RUNNER_TEMP/reporting-identity-v1.json"; then
            echo "::error title=Canonical contract unavailable::Could not verify canonical reporting identity contract"
            exit 1
          fi

      - name: Check reporting identity contract drift
        run: |
          if ! cmp -s contracts/reporting-identity-v1.json "$RUNNER_TEMP/reporting-identity-v1.json"; then
            echo "::error title=Reporting identity contract drift::Reporting identity contract drift: local bytes differ from SentryDigest v1"
            exit 1
          fi

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run Go tests
        env:
          SERVICE_VERSION: ${{ github.sha }}
        run: |
          go build ./cmd/server
          go test ./...

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
          args: --timeout=5m

  python:
    name: Python Agent Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
      - name: Run ruff
        run: uv run ruff check .
      - name: Run black
        run: uv run black --check .
      - name: Run ty
        run: uv run ty check .

  site:
    name: Site Report Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate site report artifact
        run: make check-site

  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform fmt (check)
        working-directory: configs/terraform/articles-table
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        working-directory: configs/terraform/articles-table
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: configs/terraform/articles-table
        run: terraform validate
