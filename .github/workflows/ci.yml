name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  reporting-identity:
    name: Reporting Identity Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Fetch canonical reporting identity verifier
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py fetch
          --artifact verifier
          --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py compare
          --artifact verifier
          --local-artifact contracts/reporting-identity-verifier-v1.py
          --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py fetch
          --artifact contract
          --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py compare
          --artifact contract
          --local-artifact contracts/reporting-identity-v1.json
          --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      - name: Run Go tests
        env:
          SERVICE_VERSION: ${{ github.sha }}
        run: |
          go build ./cmd/server
          go test ./...

  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12
          args: --timeout=5m

  python:
    name: Python Agent Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      - name: Sync dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -q
      - name: Run build and deployment contracts
        working-directory: .
        run: uv run --project agent python -m pytest -q scripts/tests -p no:cacheprovider
      - name: Run ruff
        run: uv run ruff check .
      - name: Run black
        run: uv run black --check .
      - name: Run ty
        run: uv run ty check .

  site:
    name: Site Report Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Validate site report artifact
        run: make check-site

  terraform:
    name: Terraform fmt/validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
      - name: Terraform fmt (check)
        working-directory: configs/terraform/articles-table
        run: terraform fmt -check -recursive
      - name: Terraform init (no backend)
        working-directory: configs/terraform/articles-table
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: configs/terraform/articles-table
        run: terraform validate
