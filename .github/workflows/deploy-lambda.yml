name: Build and Deploy Lambda

# Pushes deploy only when a Lambda image input changes: the Go and Python
# sources, their module files, the Lambda Dockerfiles and the configuration the
# Go image copies. Site, report, publication, documentation and workflow-only
# changes do not redeploy; use the manual dispatch for those.
on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile.lambda'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - 'configs/**'
      - 'agent/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  GO_REPO_NAME: grcinsight-go
  PYTHON_REPO_NAME: grcinsight-python
  GO_FUNCTION_NAME: grcinsight-go-function
  PYTHON_FUNCTION_NAME: grcinsight-python-function
  LLM_MODEL: ${{ vars.LLM_MODEL || 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}
  # Production runs the relevance pilot in shadow: decisions are recorded and the
  # legacy result is returned unchanged. Set the variable to off to roll back.
  GRC_RELEVANCE_MODE: ${{ vars.GRC_RELEVANCE_MODE || 'shadow' }}
  GRC_RELEVANCE_MIN_PROBABILITY: ${{ vars.GRC_RELEVANCE_MIN_PROBABILITY || '0.95' }}
  GRC_RELEVANCE_TIMEOUT_SECONDS: ${{ vars.GRC_RELEVANCE_TIMEOUT_SECONDS || '4' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch canonical reporting identity verifier
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py fetch
          --artifact verifier
          --canonical-output "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Check reporting identity verifier drift
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py compare
          --artifact verifier
          --local-artifact contracts/reporting-identity-verifier-v1.py
          --canonical-artifact "$RUNNER_TEMP/reporting-identity-verifier-v1.py"

      - name: Fetch canonical reporting identity contract
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py fetch
          --artifact contract
          --canonical-output "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Check reporting identity contract drift
        run: >-
          python3 contracts/reporting-identity-verifier-v1.py compare
          --artifact contract
          --local-artifact contracts/reporting-identity-v1.json
          --canonical-artifact "$RUNNER_TEMP/reporting-identity-v1.json"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate model runtime configuration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +x
          set -e
          case "$LLM_MODEL" in
            */*) ;;
            *)
              echo "Invalid LLM_MODEL; expected provider/model format" >&2
              exit 1
              ;;
          esac
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret is required for Lambda model-backed analysis" >&2
            exit 1
          fi
          case "$LLM_MODEL" in
            openrouter/*) ;;
            *)
              echo "Invalid LLM_MODEL; direct Lambda model-backed analysis requires openrouter/provider-model format" >&2
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import math
          import os

          if os.environ["GRC_RELEVANCE_MODE"] not in {"off", "shadow", "enabled"}:
              raise SystemExit("Invalid GRC_RELEVANCE_MODE")
          for name, minimum, maximum, exclusive in (
              ("GRC_RELEVANCE_MIN_PROBABILITY", 0.5, 1, False),
              ("GRC_RELEVANCE_TIMEOUT_SECONDS", 0, 10, True),
          ):
              try:
                  value = float(os.environ[name])
              except ValueError:
                  raise SystemExit(f"Invalid {name}") from None
              if (
                  not math.isfinite(value)
                  or value > maximum
                  or value < minimum
                  or (exclusive and value == minimum)
              ):
                  raise SystemExit(f"Invalid {name}")
          PY
          echo "Using LLM_MODEL=$LLM_MODEL"

      - name: Attempt login to AWS Public ECR (optional)
        continue-on-error: true
        run: |
          if ! aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws; then
            echo "Skipping ECR Public login (missing ecr-public:GetAuthorizationToken). Proceeding anonymously."
          fi

      - name: Pre-pull base images with retries
        run: |
          set -e
          retry() {
            local n=0 max=5 delay=10
            until "$@"; do
              n=$((n+1))
              if [ "$n" -ge "$max" ]; then
                echo "Command failed after $n attempts: $*" >&2
                return 1
              fi
              echo "Retry $n/$max in ${delay}s: $*"
              sleep "$delay"
              delay=$((delay*2))
            done
          }
          retry docker pull golang:1.22-alpine
          retry docker pull public.ecr.aws/lambda/go:1
          # Match Python base image digest used in agent/Dockerfile.lambda
          retry docker pull public.ecr.aws/lambda/python:3.11@sha256:d044e45093a29946e452fe0f20bf8536fb50c6a1b25f9f0f7a854323d598454f

      - name: Resolve AWS account ID
        id: aws-account
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Verify preprovisioned ECR repositories and Lambda retrieval access
        run: |
          set -euo pipefail
          for repo in "$GO_REPO_NAME" "$PYTHON_REPO_NAME"; do
            aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" > /dev/null
            aws ecr get-repository-policy --repository-name "$repo" --region "$AWS_REGION" --output json |
              python3 -I -B scripts/check_ecr_retrieval_policy.py
          done

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin ${{ steps.aws-account.outputs.registry }}

      - name: Build and push Go Lambda image (amd64, BuildKit off)
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          set -e
          REGISTRY=${{ steps.aws-account.outputs.registry }}
          GO_IMAGE_SHA="$REGISTRY/$GO_REPO_NAME:${{ github.sha }}"
          GO_IMAGE_LATEST="$REGISTRY/$GO_REPO_NAME:latest"
          docker build --platform linux/amd64 -f Dockerfile.lambda -t "$GO_IMAGE_SHA" -t "$GO_IMAGE_LATEST" .
          docker push "$GO_IMAGE_SHA"
          docker push "$GO_IMAGE_LATEST"
          echo "GO_IMAGE_SHA=$GO_IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Build and push Python Lambda image (amd64, BuildKit off)
        working-directory: agent
        env:
          DOCKER_BUILDKIT: "0"
        run: |
          set -e
          REGISTRY=${{ steps.aws-account.outputs.registry }}
          PY_IMAGE_SHA="$REGISTRY/$PYTHON_REPO_NAME:${{ github.sha }}"
          PY_IMAGE_LATEST="$REGISTRY/$PYTHON_REPO_NAME:latest"
          docker build --platform linux/amd64 -f Dockerfile.lambda -t "$PY_IMAGE_SHA" -t "$PY_IMAGE_LATEST" .
          docker push "$PY_IMAGE_SHA"
          docker push "$PY_IMAGE_LATEST"
          echo "PYTHON_IMAGE_SHA=$PY_IMAGE_SHA" >> "$GITHUB_ENV"

      - name: Update Go Lambda to new image
        run: |
          aws lambda update-function-code \
            --function-name "$GO_FUNCTION_NAME" \
            --image-uri "$GO_IMAGE_SHA" \
            --region "$AWS_REGION" \
            --query 'FunctionName' \
            --output text
          aws lambda wait function-updated \
            --function-name "$GO_FUNCTION_NAME" \
            --region "$AWS_REGION"
          python3 -I -B scripts/update_lambda_environment.py \
            --function-kind go --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"

      - name: Update Python Lambda to new image
        run: |
          aws lambda update-function-code \
            --function-name "$PYTHON_FUNCTION_NAME" \
            --image-uri "$PYTHON_IMAGE_SHA" \
            --region "$AWS_REGION" \
            --query 'FunctionName' \
            --output text
          aws lambda wait function-updated \
            --function-name "$PYTHON_FUNCTION_NAME" \
            --region "$AWS_REGION"

      - name: Merge Python Lambda runtime environment
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set +x
          python3 -I -B scripts/update_lambda_environment.py \
            --function-kind python --account-id "$AWS_ACCOUNT_ID" --region "$AWS_REGION"

      - name: Wait for Lambda updates to complete
        run: |
          for fn in "$GO_FUNCTION_NAME" "$PYTHON_FUNCTION_NAME"; do
            echo "Waiting for $fn to be Active..."
            ready=false
            for _ in {1..30}; do
              STATUS=$(aws lambda get-function --function-name "$fn" --query 'Configuration.[State,LastUpdateStatus]' --output text)
              echo "$fn -> $STATUS"
              read -r STATE UPDATE_STATUS <<< "$STATUS"
              if [ "$STATE" = "Active" ] && [ "$UPDATE_STATUS" = "Successful" ]; then
                ready=true
                break
              fi
              if [ "$UPDATE_STATUS" = "Failed" ]; then
                echo "$fn update failed" >&2
                exit 1
              fi
              sleep 5
            done
            if [ "$ready" != true ]; then
              echo "$fn did not become Active/Successful before timeout" >&2
              exit 1
            fi
          done

      - name: Verify deployed image references
        run: |
          set -euo pipefail
          verify_image() {
            local function_name="$1" expected="$2" actual
            actual=$(aws lambda get-function --function-name "$function_name" \
              --region "$AWS_REGION" --query 'Code.ImageUri' --output text)
            if [ "$actual" != "$expected" ]; then
              echo "Deployed Lambda image reference does not match this release" >&2
              exit 1
            fi
          }
          verify_image "$GO_FUNCTION_NAME" "$GO_IMAGE_SHA"
          verify_image "$PYTHON_FUNCTION_NAME" "$PYTHON_IMAGE_SHA"

      - name: Smoke test Go Lambda health
        run: |
          set -euo pipefail
          export AWS_MAX_ATTEMPTS=1
          # GetFunction reports reserved concurrency with the permission this
          # workflow already uses; an unreserved function returns null here.
          GO_CONCURRENCY=$(aws lambda get-function \
            --function-name "$GO_FUNCTION_NAME" --region "$AWS_REGION" \
            --query 'Concurrency' --output json)
          if [ "$GO_CONCURRENCY" = "null" ]; then GO_CONCURRENCY='{}'; fi
          GO_HEALTH_MODE=$(printf '%s' "$GO_CONCURRENCY" |
            python3 -I -B scripts/check_lambda_maintenance.py)
          if [ "$GO_HEALTH_MODE" = "paused" ]; then
            echo "Go API health deferred while reserved concurrency is zero"
            aws lambda invoke \
              --function-name "$PYTHON_FUNCTION_NAME" \
              --payload '{"health_check":true}' \
              --cli-binary-format raw-in-base64-out --region "$AWS_REGION" \
              "$RUNNER_TEMP/python-health.json" >/dev/null
            if [ "$(jq -r '.statusCode // empty' "$RUNNER_TEMP/python-health.json")" != "200" ] || \
               [ "$(jq -r '.body.status // empty' "$RUNNER_TEMP/python-health.json")" != "healthy" ]; then
              echo "Python Lambda non-inference health check failed" >&2
              exit 1
            fi
            echo "Python non-inference health verified; operator restoration and Go health remain deferred"
            exit 0
          fi
          aws lambda invoke \
            --function-name "$GO_FUNCTION_NAME" \
            --payload '{"httpMethod":"GET","path":"/health"}' \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            health.json >/dev/null

          STATUS_CODE=$(jq -r '.statusCode // empty' health.json)
          BODY=$(jq -r '.body // empty' health.json)
          if [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
            HEALTH_STATUS=$(printf '%s' "$BODY" | jq -r '.status // empty' 2>/dev/null || echo "unknown")
          else
            HEALTH_STATUS="unknown"
          fi

          echo "Lambda status code: ${STATUS_CODE:-unknown}"
          echo "Lambda health status: ${HEALTH_STATUS:-unknown}"

          if [ "$STATUS_CODE" != "200" ] || [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "Lambda health smoke test failed" >&2
            exit 1
          fi
