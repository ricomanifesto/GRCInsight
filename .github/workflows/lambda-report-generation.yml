name: Generate GRC Report with Lambda

on:
  repository_dispatch:
  schedule:
    - cron: '0 13 * * *'  # Once daily at 8 AM CT (13:00 UTC)
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'RSS Feed URL'
        required: false
        default: 'https://ricomanifesto.github.io/SentryDigest/feed.xml'

concurrency:
  group: grcinsight-report-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  GO_FUNCTION_NAME: grcinsight-go-function
  PYTHON_FUNCTION_NAME: grcinsight-python-function
  LLM_MODEL: ${{ vars.LLM_MODEL || 'openrouter/nvidia/nemotron-3-ultra-550b-a55b:free' }}

jobs:
  generate-report:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Verify canonical reporting identity contract
      run: |
        curl --fail --silent --show-error \
          https://raw.githubusercontent.com/ricomanifesto/SentryDigest/main/contracts/reporting-identity-v1.json \
          --output "$RUNNER_TEMP/reporting-identity-v1.json"
        cmp contracts/reporting-identity-v1.json "$RUNNER_TEMP/reporting-identity-v1.json"

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Health check (Go Lambda)
      id: health
      run: |
        set -e
        PAYLOAD='{"httpMethod":"GET","path":"/health","headers":{}}'
        attempts=1
        max_attempts=5
        while [ $attempts -le $max_attempts ]; do
          echo "Health check attempt $attempts/$max_attempts"
          aws lambda invoke \
            --function-name "$GO_FUNCTION_NAME" \
            --payload "$PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            health.json >/dev/null || true
          # Parse body which may be JSON string - more robust parsing
          BODY=$(cat health.json | jq -r '.body // empty')
          if [ -n "$BODY" ] && [ "$BODY" != "null" ]; then
            STATUS=$(echo "$BODY" | jq -r '.status // empty' 2>/dev/null || echo "unknown")
          else
            STATUS="unknown"
          fi
          echo "Reported status: ${STATUS:-unknown}"
          if [ "$STATUS" = "healthy" ]; then
            echo "Go Lambda health OK"
            break
          fi
          attempts=$((attempts+1))
          sleep 5
        done
        if [ "$STATUS" != "healthy" ]; then
          echo "Go Lambda health check failed" >&2
          exit 1
        fi

    - name: Set feed URL
      id: feed-url
      env:
        DISPATCH_FEED_URL: ${{ github.event.client_payload.feed_url }}
        WORKFLOW_FEED_URL: ${{ github.event.inputs.feed_url }}
      run: |
        FEED_URL=""
        if [ "$GITHUB_EVENT_NAME" = "repository_dispatch" ]; then
          FEED_URL="$DISPATCH_FEED_URL"
        elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          FEED_URL="$WORKFLOW_FEED_URL"
        fi
        if [ -z "$FEED_URL" ] || [ "$FEED_URL" = "null" ]; then
          FEED_URL="https://ricomanifesto.github.io/SentryDigest/feed.xml"
        fi
        case "$FEED_URL" in
          http://*|https://*) ;;
          *)
            echo "Invalid FEED_URL; expected http(s) URL without whitespace" >&2
            exit 1
            ;;
        esac
        if printf '%s' "$FEED_URL" | grep -q '[[:space:]]'; then
          echo "Invalid FEED_URL; expected http(s) URL without whitespace" >&2
          exit 1
        fi
        echo "Using FEED_URL=$FEED_URL"
        printf 'FEED_URL=%s\n' "$FEED_URL" >> "$GITHUB_OUTPUT"

    - name: Invoke Lambda report generation
      id: lambda-invoke
      env:
        FEED_URL: ${{ steps.feed-url.outputs.FEED_URL }}
      run: |
        case "$LLM_MODEL" in
          openrouter/*) ;;
          *)
            echo "Invalid LLM_MODEL; report generation requires openrouter/provider-model format" >&2
            exit 1
            ;;
        esac
        echo "Using LLM_MODEL=$LLM_MODEL"

        # Create payload for Lambda invocation
        BODY=$(jq -n --arg feed_url "$FEED_URL" --arg model "$LLM_MODEL" -c \
          '{feed_url: $feed_url, config: {model: $model, max_tokens: 16000, focus_areas: ["governance", "compliance", "risk"]}}')
        PAYLOAD=$(jq -n --arg body "$BODY" -c \
          '{httpMethod: "POST", path: "/api/v1/reports/generate", headers: {"Content-Type": "application/json"}, body: $body}')

        echo "Invoking Lambda function: $GO_FUNCTION_NAME"

        # Invoke Go Lambda function
        aws lambda invoke \
          --function-name $GO_FUNCTION_NAME \
          --payload "$PAYLOAD" \
          --cli-binary-format raw-in-base64-out \
          --region $AWS_REGION \
          lambda-response.json

        # Check if invocation was successful
        if [ $? -eq 0 ]; then
          STATUS_CODE=$(jq -r '.statusCode // empty' lambda-response.json)
          echo "Lambda invocation successful"
          echo "Lambda status code: ${STATUS_CODE:-unknown}"

          # Extract report ID from response
          REPORT_ID=$(jq -r '.body | (try fromjson catch .) | .report_id // empty' lambda-response.json)
          if [ ! -z "$REPORT_ID" ]; then
            echo "REPORT_ID=$REPORT_ID" >> $GITHUB_OUTPUT
            echo "Report generated with ID: $REPORT_ID"
          else
            echo "Failed to extract report ID from response"
            exit 1
          fi
        else
          echo "Lambda invocation failed"
          exit 1
        fi

    - name: Retrieve generated report
      id: get-report
      if: steps.lambda-invoke.outputs.REPORT_ID
      env:
        FEED_URL: ${{ steps.feed-url.outputs.FEED_URL }}
      run: |
        set -e
        echo "Retrieving report ID: ${{ steps.lambda-invoke.outputs.REPORT_ID }}"

        REPORT_ID=${{ steps.lambda-invoke.outputs.REPORT_ID }}
        MAX_ATTEMPTS=${MAX_ATTEMPTS:-90}   # up to ~15 minutes
        SLEEP_SECONDS=${SLEEP_SECONDS:-10}

        attempt=1
        while [ $attempt -le $MAX_ATTEMPTS ]; do
          echo "Attempt $attempt/$MAX_ATTEMPTS to fetch report..."

          GET_PAYLOAD='{"httpMethod":"GET","path":"/api/v1/reports/'$REPORT_ID'","headers":{}}'

          aws lambda invoke \
            --function-name "$GO_FUNCTION_NAME" \
            --payload "$GET_PAYLOAD" \
            --cli-binary-format raw-in-base64-out \
            --region "$AWS_REGION" \
            report-response.json >/dev/null

          # Parse body; handle both raw object or JSON string body
          cat report-response.json | jq -r '.body | (try fromjson catch .)' > report-data.json

          STATUS=$(jq -r '.status // empty' report-data.json)
          CONTENT=$(jq -r '.content // empty' report-data.json)
          ANALYSIS_MODE=$(jq -r '.metadata.analysis_mode // empty' report-data.json)
          REQUESTED_MODEL=$(jq -r '.metadata.requested_model // empty' report-data.json)
          RESOLVED_MODEL=$(jq -r '.metadata.resolved_model // empty' report-data.json)
          SOURCE_HOME_URL=$(jq -r '.metadata.source_home_url // empty' report-data.json)
          SOURCE_ISSUE_DATE=$(jq -r '.metadata.source_issue_date // empty' report-data.json)
          SOURCE_ISSUE_URL=$(jq -r '.metadata.source_issue_url // empty' report-data.json)

          if [ "$STATUS" = "failed" ]; then
            echo "Report status is 'failed'. Aborting early." >&2
            if jq -e '.error? // .message? // empty' report-data.json >/dev/null; then
              echo "Report failure reason returned; details omitted from logs." >&2
            fi
            exit 1
          fi

          if [ "$STATUS" = "completed" ]; then
            if [ "$ANALYSIS_MODE" != "model" ]; then
              echo "Refusing to publish a fallback-mode report; keeping the last model-backed report." >&2
              exit 1
            fi
            if [ "$REQUESTED_MODEL" != "$LLM_MODEL" ]; then
              echo "Refusing to publish a report with mismatched requested-model provenance." >&2
              exit 1
            fi
            case "$RESOLVED_MODEL" in
              ""|openrouter/free|openrouter/auto)
                echo "Refusing to publish a report without an upstream resolved model." >&2
                exit 1
                ;;
            esac
            case "$SOURCE_ISSUE_DATE" in
              ????-??-??) ;;
              *)
                echo "Refusing to publish a report without a feed-owned issue date." >&2
                exit 1
                ;;
            esac
            EXPECTED_SOURCE_ISSUE_URL="${SOURCE_HOME_URL%/}/archive/${SOURCE_ISSUE_DATE}/"
            if [ "$SOURCE_ISSUE_URL" != "$EXPECTED_SOURCE_ISSUE_URL" ]; then
              echo "Refusing to publish a report with mismatched digest issue provenance." >&2
              exit 1
            fi
            echo "Report completed. Building site files..."

            CONTENT_LEN=$(printf %s "$CONTENT" | wc -c | tr -d ' ')
            echo "Content length (bytes): ${CONTENT_LEN:-0}"
            if [ -z "$CONTENT" ] || [ "$CONTENT" = "null" ]; then
              echo "No report content returned — keeping last successful report."
              exit 1
            fi

            python3 scripts/compose_site_report.py \
              --input report-data.json \
              --feed-url "$FEED_URL" \
              --model "$LLM_MODEL"
            python3 scripts/build_site.py --archive-current

            echo "Report files created successfully"
            break
          else
            echo "Status: ${STATUS:-unknown}. Waiting ${SLEEP_SECONDS}s..."
            sleep $SLEEP_SECONDS
            attempt=$((attempt+1))
          fi
        done

        if [ $attempt -gt $MAX_ATTEMPTS ]; then
          echo "Timed out waiting for report to complete" >&2
          exit 1
        fi

    - name: Dump recent Lambda logs (Go & Python)
      if: failure()
      continue-on-error: true
      env:
        SINCE_MINUTES: 60
      run: |
        set -e
        echo "Collecting CloudWatch logs for the last ${SINCE_MINUTES} minutes..."
        END_TS=$(date +%s000)
        START_TS=$(( ( $(date +%s) - SINCE_MINUTES*60 ) * 1000 ))
        for FN in "$GO_FUNCTION_NAME" "$PYTHON_FUNCTION_NAME"; do
          echo "=== Logs for ${FN} ==="
          LG="/aws/lambda/${FN}"
          if aws logs describe-log-groups --log-group-name-prefix "$LG" >/dev/null 2>&1; then
            aws logs filter-log-events \
              --log-group-name "$LG" \
              --start-time "$START_TS" \
              --end-time "$END_TS" \
              --max-items 400 \
              --output json > cw.json || true
            jq -r '.events[] | "[\(.timestamp)] \(.message)"' cw.json | sed -e 's/\\n/\n/g' | sed -e 's/\r$//' | tee cw.txt || true
            echo "--- ERROR lines (last 50) ---"
            grep -i "error" cw.txt | tail -n 50 || true
            echo "--- Last RequestId ---"
            grep -E "(RequestId:|START RequestId:)" cw.txt | tail -n 1 || true
          else
            echo "No log group found: $LG" >&2
          fi
          echo
        done

    - name: Validate generated site report
      if: steps.get-report.conclusion == 'success'
      run: make check-site

    - name: Commit and push report
      id: publish
      if: steps.get-report.conclusion == 'success'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add site/index.md site/index.html site/evidence-manifest.json site/archive
        if git diff --cached --quiet; then
          echo "No report changes to commit"
          exit 0
        fi

        git commit -m "Update GRC intelligence report [automated]"

        attempts=1
        max_attempts=3
        while [ $attempts -le $max_attempts ]; do
          git fetch origin "$GITHUB_REF_NAME"
          git rebase -X theirs "origin/$GITHUB_REF_NAME"
          python3 scripts/compose_site_report.py \
            --input report-data.json \
            --feed-url "${{ steps.feed-url.outputs.FEED_URL }}" \
            --model "$LLM_MODEL"
          python3 scripts/build_site.py --archive-current
          make check-site
          git add site/index.md site/index.html site/evidence-manifest.json site/archive
          git commit --amend --no-edit

          if git push origin HEAD:"$GITHUB_REF_NAME"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          attempts=$((attempts+1))
          if [ $attempts -le $max_attempts ]; then
            echo "Push raced with a newer remote update; retrying..."
          fi
        done

        echo "Failed to push the generated report after $max_attempts attempts" >&2
        exit 1

    - name: Dispatch Pages deployment
      if: steps.publish.outputs.published == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run deploy-site.yml --ref "$GITHUB_REF_NAME"
